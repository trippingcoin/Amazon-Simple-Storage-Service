events { worker_connections 1024; }
http {
    # Container DNS supplies all API replica addresses and refreshes on scaling.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream storage_api {
        zone storage_api 64k;
        server api:8080 resolve;
        keepalive 32;
    }
    # Never write object names, credentials or headers into proxy access logs.
    access_log off;
    server {
        listen 8080;
        client_max_body_size 0;
        client_header_timeout 10s;
        client_body_timeout 120s;
        location / {
            proxy_pass http://storage_api;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 130s;
            proxy_send_timeout 130s;
            # A lost acknowledgement can follow a committed write. Do not replay it.
            proxy_next_upstream off;
        }
    }
}

# Example only: no Prometheus service is installed or started by this repository.
# Loopback assumes Prometheus and the storage server share a network namespace.
scrape_configs:
  - job_name: triple-s
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: /-/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/triple-s-token
    static_configs:
      - targets: ['127.0.0.1:8080']
